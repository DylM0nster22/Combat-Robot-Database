# Publishes the generated site to GitHub Pages.
#
# This does nothing until Pages is enabled for the repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Until then the workflow is inert.
name: deploy site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Rebuild rather than trusting the committed copy, so the published site
      # always matches the research files in the same commit.
      - name: Build database and site
        run: |
          python3 scripts/build_db.py
          python3 scripts/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
